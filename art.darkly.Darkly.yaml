# Generated by scripts/flathub.sh from packaging/flathub/art.darkly.Darkly.yaml.in in the darkly repo. Edit the template, not the output.
# Offline build: tools missing from the SDK are pinned tarballs; crates and npm packages come from cargo-sources.json and generated-sources.json.
app-id: art.darkly.Darkly

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '26.08'

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

command: darkly

# flatpak-builder 1.4.9 corrupts the hardlinked libLLVM in /app/rust when it splits debuginfo. Electron ships stripped anyway.
build-options:
  no-debuginfo: true

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  # Version must match rust-version in Cargo.toml. The rust-stable SDK extension has no wasm32 std and is read-only.
  - name: rust-toolchain
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - cd rust-host && ./install.sh --prefix=/app/rust --disable-ldconfig
        --without=rust-docs,rust-docs-json-preview,llvm-tools-preview,rust-analyzer-preview,clippy-preview,rustfmt-preview
      - cd rust-std-wasm && ./install.sh --prefix=/app/rust --disable-ldconfig
    sources:
      - type: archive
        only-arches: [x86_64]
        dest: rust-host
        url: https://static.rust-lang.org/dist/rust-1.98.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: ed8ee2df70909c88cbaf87a6cfa3920dac00b537de12a6abe6906641e0f5952f
      - type: archive
        only-arches: [aarch64]
        dest: rust-host
        url: https://static.rust-lang.org/dist/rust-1.98.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: ac9283184301aeed06ecc9f5aa4c1be7041e18a1b197b6cb6c5d162d98f566da
      - type: archive
        dest: rust-std-wasm
        url: https://static.rust-lang.org/dist/rust-std-1.98.0-wasm32-unknown-unknown.tar.xz
        sha256: 3bb537c09555b96020a38a3a8810c38908b194eff3c2cb6184a45dda5c6828de

  # Version must match the wasm-bindgen crate in Cargo.lock. Prebuilt because wasm-pack downloads this at build time.
  - name: wasm-bindgen
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - install -Dm755 wasm-bindgen /app/bin/wasm-bindgen
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl.tar.gz
        sha256: ce21be002bdbc22ede2a5cf250cb801d2106956fc3c529c75d9452729db3490c
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-aarch64-unknown-linux-musl.tar.gz
        sha256: 39103878ad3c0016f2d04b7b4a6206c974240286852abac5736d017a43703958

  # wasm-opt for the Makefile. Not pinned upstream; bump both arches together.
  - name: binaryen
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - install -Dm755 bin/wasm-opt /app/bin/wasm-opt
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        sha256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-aarch64-linux.tar.gz
        sha256: 89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8

  - name: darkly
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/app/rust/bin
      env:
        CARGO_HOME: /run/build/darkly/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/darkly/flatpak-node/cache
        npm_config_cache: /run/build/darkly/flatpak-node/npm-cache
        npm_config_offline: 'true'
        # Read by desktop/forge.config.js. @electron/get refetches SHASUMS256.txt even with a warm cache, so the zip is passed directly.
        DARKLY_ELECTRON_ZIP_DIR: /run/build/darkly/flatpak-node/cache/electron
    build-commands:
      # Offline equivalent of `make deps`.
      - cd frontend && npm ci --offline --ignore-scripts
      - cd desktop && npm ci --offline --ignore-scripts
      - make app
      - make install PREFIX=/app LIBDIR=/app
        LICENSEDIR=/app/share/licenses/art.darkly.Darkly
      # Replace the symlink with a zypak launcher; chrome-sandbox is unusable in flatpak.
      - rm /app/bin/darkly /app/darkly/chrome-sandbox
      - install -Dm755 darkly.sh /app/bin/darkly
    sources:
      - type: git
        url: https://github.com/darkly-art/darkly.git
        commit: 58e1df0bf884951c44d73251972f5f4360cf1975
        disable-shallow-clone: true
      - cargo-sources.json
      - generated-sources.json
      - type: script
        dest-filename: darkly.sh
        commands:
          - exec zypak-wrapper /app/darkly/darkly "$@"
